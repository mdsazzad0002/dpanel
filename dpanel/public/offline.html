<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#03060f">
    <title>Offline - dPanel</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #03060f;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        main { max-width: 360px; }
        img { width: 88px; height: 88px; }
        h1 { font-size: 1.25rem; margin: 16px 0 8px; }
        p { margin: 0 0 24px; color: #9ca3af; line-height: 1.5; }
        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 20px;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: #2563eb;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <main>
        <img src="/pwa/icon-192.png" alt="dPanel">
        <h1>You are offline</h1>
        <p>dPanel can't reach the server right now. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </main>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
