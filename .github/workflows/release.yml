# Publishes a release when VERSION changes on main. installer.sh installs the
# highest version tag by default, so bumping VERSION is how a release ships.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          # Same shape installer.sh accepts as a release tag, such as 0.82 or v1.2.3.
          if [[ ! "$version" =~ ^v?[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::VERSION must look like 0.82 or v1.2.3, got '${version}'."
            exit 1
          fi
          echo "tag=${version}" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
