[package]
name = "drust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio"] }
portable-pty = "0.9"
futures-util = "0.3"
bytes = "1"
# Compressed copies of cached responses (already pulled in by tower-http).
brotli = "8"
flate2 = "1"
tar = "0.4"
# Backups from other panels may be .tar.zst (already pulled in by tower-http).
zstd = "0.13"
tokio-util = { version = "0.7", features = ["io"] }
redis = { version = "0.32", features = ["tokio-comp"] }
whisper-rs = { version = "0.14", optional = true }
tesseract = { version = "0.15", optional = true }
hound = { version = "3", optional = true }
tempfile = "3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
socket2 = { version = "0.6", features = ["all"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http = "1"
http-body = "1"
# Mail DNS checks query public resolvers directly (like dig), never /etc/hosts.
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime"] }
mongodb = "3"
# The ACME client (task I5): account and certificate keys, the CSR, and
# reading a certificate's names and expiry without the openssl program.
ring = "0.17"
rcgen = "0.14"
x509-parser = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[features]
# Linux keeps both. Windows and macOS builds pass --no-default-features: Cargo
# defaults cannot differ by target, and neither library is proven there yet.
default = ["ocr", "speech"]
# Image OCR for chat channels. Needs the system Tesseract 5+; install-service.sh
# turns it off on distros that ship an older one (Ubuntu 22.04 has 4.1).
ocr = ["dep:tesseract"]
# Voice note transcription. Builds the bundled whisper.cpp (cmake, clang).
speech = ["dep:whisper-rs", "dep:hound"]

[dev-dependencies]
webpki-roots = "1.0.9"
# The test ACME server signs what the client asks for, so it reads a CSR.
rcgen = { version = "0.14", features = ["x509-parser"] }
time = "0.3"
