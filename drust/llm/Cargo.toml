[package]
name = "drust-llm"
version = "0.1.0"
edition = "2024"

# Separate crate (not part of drust's own build) so the llama.cpp compile and
# the memory a loaded model takes stay out of the main drust service.

[dependencies]
llama-cpp-2 = "0.1.160"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
