[program:dpanel-queue]
command=/usr/bin/php __DPANEL_APP_DIR__/artisan queue:work --queue=server-commands,default --sleep=1 --tries=3 --timeout=300 --max-time=3600
directory=__DPANEL_APP_DIR__
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=__DPANEL_APP_DIR__/storage/logs/queue.log

[program:dpanel-heavy-queue]
command=/usr/bin/php __DPANEL_APP_DIR__/artisan queue:work --queue=heavy --sleep=1 --tries=1 --timeout=3600 --max-time=3600
directory=__DPANEL_APP_DIR__
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3700
redirect_stderr=true
stdout_logfile=__DPANEL_APP_DIR__/storage/logs/heavy-queue.log

; Website deletions (App\Jobs\DeleteWebsiteJob): their own queue so a delete
; never waits behind a big backup on `heavy`, with 3 processes so a few sites
; are removed side by side. The job itself caps how many run at once
; (dpanel.background_tasks.concurrency.website_delete) — keep numprocs and that
; number in step.
[program:dpanel-deletions-queue]
command=/usr/bin/php __DPANEL_APP_DIR__/artisan queue:work --queue=deletions --sleep=1 --tries=1 --timeout=3600 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=3
directory=__DPANEL_APP_DIR__
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3700
redirect_stderr=true
stdout_logfile=__DPANEL_APP_DIR__/storage/logs/deletions-queue.log

; Runs the panel's scheduled commands (routes/console.php): backups, SSL and
; mail certificate renewal, mail delivery checks, git sync.
[program:dpanel-scheduler]
command=/usr/bin/php __DPANEL_APP_DIR__/artisan schedule:work
directory=__DPANEL_APP_DIR__
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=__DPANEL_APP_DIR__/storage/logs/scheduler.log
